<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CallGate · 请求端</title><link rel="stylesheet" href="/review-ui.css">
<main data-role="participant">
<h1>CallGate 请求端</h1>
<p>文本回放演示：风险提醒 → 单独确认 → 模拟操作。不会转账。</p>
<section><h2>1. 提交通话内容</h2>
<label for="transcript">英文测试台词</label>
<textarea id="transcript" rows="3">Move your savings into the secure holding wallet.</textarea>
<button id="ingest">分析这句话</button><p id="risk" role="status">尚未分析</p>
<p>继续提交新内容会使待确认请求失效。可提交 “Do not tell anyone.” 检查保密施压时的拒绝。</p>
</section>
<section><h2>2. 申请一次演示操作</h2>
<label for="destination">目标（虚构）</label><input id="destination" maxlength="80" value="demo-wallet">
<label for="amount">金额（美分，280000 = 2,800.00 美元）</label>
<input id="amount" type="number" min="1" max="100000000" step="1" value="280000">
<button id="request">提交给核验者</button>
<p>只有“先核验”状态可提交。保密施压或密码请求需要暂停，这条演示路径不会放行。</p>
</section>
<section><h2>3. 查看结果</h2><button id="refresh">刷新结果</button>
<p id="status" role="status">请使用启动程序给出的请求端链接。</p></section>
<p>核验者链接只交给核验者；知道该链接的人就能代表此演示的核验者。它不是实名身份认证。每次启动创建一条临时会话。</p>
</main><script src="/review-ui.js" defer></script></html>
